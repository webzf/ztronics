name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number for preview"
        required: false
        type: string
      pr_sha:
        description: "Pull request head SHA for preview"
        required: false
        type: string
      pr_action:
        description: "Pull request action for immediate preview rebuild"
        required: false
        default: "synchronize"
        type: string

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate commerce database
        run: ruby scripts/validate-commerce.rb

      - name: Build production site
        run: bundle exec ruby -r jekyll -r ./_plugins/internal_linker.rb $(bundle show jekyll)/exe/jekyll build

      - name: Build active PR previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p _site/preview

          # Rebuild every currently open PR preview on every Pages deployment.
          # This prevents a normal master deployment from removing existing previews.
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pulls?state=open&base=master&per_page=100" \
            --jq '.[] | [.number, .head.sha] | @tsv' > /tmp/open-prs.tsv

          while IFS=$'\\t' read -r pr_number pr_sha; do
            [ -n "$pr_number" ] || continue

            echo "Building preview for PR #${pr_number} (${pr_sha})"

            # Fetch the PR head explicitly so the SHA is guaranteed to exist locally.
            git fetch --no-tags origin "pull/${pr_number}/head"
            git worktree add --detach "pr-site-${pr_number}" FETCH_HEAD

            sed -i 's#<meta name="robots" content="index,follow,max-image-preview:large">#<meta name="robots" content="noindex,nofollow,noarchive">#' "pr-site-${pr_number}/_includes/head/custom.html"

            bundle exec ruby -r jekyll -r ./_plugins/internal_linker.rb \
              $(bundle show jekyll)/exe/jekyll build \
              --source "pr-site-${pr_number}" \
              --drafts \
              --baseurl "/preview/pr-${pr_number}" \
              --destination "_site/preview/pr-${pr_number}"

            git worktree remove --force "pr-site-${pr_number}"
          done < /tmp/open-prs.tsv

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
