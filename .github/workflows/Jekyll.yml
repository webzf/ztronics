name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number for preview"
        required: false
        type: string
      pr_sha:
        description: "Pull request head SHA for preview"
        required: false
        type: string
      pr_action:
        description: "Pull request action"
        required: false
        default: "synchronize"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Create PR worktree
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.pr_action != 'closed' }}
        run: git worktree add --detach pr-site "${{ inputs.pr_sha }}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate commerce database
        run: ruby scripts/validate-commerce.rb

      - name: Build production site
        run: bundle exec ruby -r jekyll -r ./_plugins/internal_linker.rb $(bundle show jekyll)/exe/jekyll build

      - name: Prepare preview robots policy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.pr_action != 'closed' }}
        run: |
          sed -i 's#<meta name="robots" content="index,follow,max-image-preview:large">#<meta name="robots" content="noindex,nofollow,noarchive">#' pr-site/_includes/head/custom.html

      - name: Build PR preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.pr_action != 'closed' }}
        run: |
          bundle exec ruby -r jekyll -r ./_plugins/internal_linker.rb $(bundle show jekyll)/exe/jekyll build             --source pr-site             --drafts             --baseurl "/preview/pr-${{ inputs.pr_number }}"             --destination "_site/preview/pr-${{ inputs.pr_number }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
