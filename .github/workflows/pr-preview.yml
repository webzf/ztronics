name: Prepare Pull Request Preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  actions: write

jobs:
  dispatch-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Request preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          gh workflow run Jekyll.yml             --repo "${{ github.repository }}"             --ref master             -f pr_number="${PR_NUMBER}"             -f pr_sha="${PR_SHA}"             -f pr_action="${PR_ACTION}"
