name: Build isolated design preview

on:
  push:
    branches:
      - design/embedded-nerd-theme
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "design-preview-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Install Jekyll dependencies
        run: bundle install

      - name: Build design branch locally
        run: bundle exec jekyll build --baseurl "/ztronics"
        env:
          JEKYLL_ENV: production

      - name: Add standalone mockups
        run: |
          mkdir -p _site/design-mockup _site/article-mockup
          cp preview/product-page.html _site/design-mockup/index.html
          cp preview/article-page.html _site/article-mockup/index.html
          touch _site/.nojekyll

      - name: Upload preview as workflow artifact only
        uses: actions/upload-artifact@v4
        with:
          name: embedded-nerd-design-preview
          path: _site
          retention-days: 7
