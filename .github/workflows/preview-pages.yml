name: Publish design preview

on:
  push:
    branches:
      - design/embedded-nerd-theme
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-preview"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Install Jekyll dependencies
        run: bundle install

      - name: Build full Jekyll site for project Pages
        run: bundle exec jekyll build --baseurl "/ztronics"
        env:
          JEKYLL_ENV: production

      - name: Keep standalone design mockup available
        run: |
          mkdir -p _site/design-mockup _site/article-mockup
          cp preview/product-page.html _site/design-mockup/index.html
          cp preview/article-page.html _site/article-mockup/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
