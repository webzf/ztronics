name: Publish design preview

on:
  push:
    branches:
      - design/embedded-nerd-theme
    paths:
      - 'preview/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-preview"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare preview site
        run: |
          mkdir -p _site
          cp preview/product-page.html _site/index.html
          touch _site/.nojekyll

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
