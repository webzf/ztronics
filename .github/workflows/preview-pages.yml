name: Restore production from master

on:
  push:
    branches:
      - design/embedded-nerd-theme
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-preview"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Install Jekyll dependencies
        run: bundle install

      - name: Build production site from master
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Restore production site from master
        id: deployment
        uses: actions/deploy-pages@v4
