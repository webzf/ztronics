{% assign product = include.product %}

{% if product.links and product.links.size > 0 %}

<section class="en-product-links">

    <h3 class="en-section-title">

        Resources
 
    </h3>

    <div class="en-links-grid">

        {% for link in product.links %}

        <a
            class="en-resource-card"
            href="{{ link.url }}"
            target="_blank"
            rel="noopener">

            <div class="en-resource-icon">

                <i class="fas fa-{{ link.icon }}"></i>

            </div>

            <div class="en-resource-content">

                <strong>

                    {{ link.title }}
                    <br>

                </strong>

                {% if link.description %}

                <small>

                    {{ link.description }}

                </small>

                {% endif %}

            </div>

            <div class="en-resource-arrow">

                →

            </div>

        </a>

        {% endfor %}

    </div>

</section>

{% endif %}
