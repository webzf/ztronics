{% assign product = include.product %}
{% assign commerce = include.commerce %}

{% if product %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": {{ product.title | jsonify }}
  {% if product.description %}
  ,"description": {{ product.description | strip_html | jsonify }}
  {% endif %}
  {% if product.image %}
  ,"image": [
    {{ product.image | absolute_url | jsonify }}
  ]
  {% endif %}
  {% if product.manufacturer %}
  ,"brand": {
    "@type": "Brand",
    "name": {{ product.manufacturer | jsonify }}
  }
  {% endif %}
  {% if product.product_id %}
  ,"sku": {{ product.product_id | jsonify }}
  {% endif %}

  {% comment %}
  ==========================================================================
  OFFER
  Only generate an Offer when the preferred store has:
  - enabled: true
  - affiliate_url
  - price
  ==========================================================================
  {% endcomment %}

  {% if commerce and commerce.preferred_store %}
    {% assign preferred = commerce.stores[commerce.preferred_store] %}

    {% if preferred and preferred.enabled and preferred.affiliate_url and preferred.price %}
  ,"offers": {
    "@type": "Offer",
    "url": {{ preferred.affiliate_url | jsonify }},
    "price": {{ preferred.price | jsonify }}
    {% if preferred.currency %}
    ,"priceCurrency": {{ preferred.currency | jsonify }}
    {% endif %}
    {% if preferred.availability %}
    ,"availability": {{ preferred.availability | jsonify }}
    {% endif %}
  }
    {% endif %}
  {% endif %}
}
</script>

{% endif %}
