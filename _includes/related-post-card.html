{% if post.header.teaser %}
  {% assign teaser = post.header.teaser %}
{% else %}
  {% assign teaser = site.teaser %}
{% endif %}
<div class="grid__item">
  <article class="archive__item" itemscope itemtype="https://schema.org/CreativeWork"{% if post.locale %} lang="{{ post.locale }}"{% endif %}>
    {% if teaser %}
      <div class="archive__item-teaser">
        <img src="{{ teaser | relative_url }}" alt="" loading="lazy">
      </div>
    {% endif %}
    <h2 class="archive__item-title no_toc p-name" itemprop="headline">
      <a class="u-url" href="{{ post.url | relative_url }}" rel="permalink">{{ post.title | markdownify | remove: "<p>" | remove: "</p>" }}</a>
    </h2>
  </article>
</div>
