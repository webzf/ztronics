{% unless page.url == '/tools/esp32-touchscreen-selector/' or page.layout == 'product' %}
  <section class="sidebar-display-banner" aria-label="ESP32 Display Selector">
    <div class="sidebar-display-banner__icon" aria-hidden="true">
      <i class="fas fa-display"></i>
    </div>
    <span class="sidebar-display-banner__eyebrow">Embedded Nerd Tool</span>
    <h3>Choosing an ESP32 display?</h3>
    <p>Compare touchscreen boards by size, interface, touch, PSRAM and LVGL support.</p>
    <a href="{{ '/tools/esp32-touchscreen-selector/' | relative_url }}" class="btn btn--primary">
      Try the Selector <span aria-hidden="true">→</span>
    </a>
  </section>
{% endunless %}

<script>
(function () {
  function setupTallSidebar() {
    var sidebar = document.querySelector('#main .sidebar.sticky') ||
                  document.querySelector('#main .sidebar__left.sticky') ||
                  document.querySelector('#main .sidebar');
    if (!sidebar || window.innerWidth < 1025) return;

    function updateSidebarOffset() {
      sidebar.style.setProperty('position', 'sticky', 'important');
      sidebar.style.setProperty('height', 'max-content', 'important');
      sidebar.style.setProperty('max-height', 'none', 'important');
      sidebar.style.setProperty('overflow', 'visible', 'important');

      var fullHeight = Math.max(sidebar.scrollHeight, sidebar.getBoundingClientRect().height);
      var topOffset = Math.min(16, window.innerHeight - fullHeight - 16);
      sidebar.style.setProperty('top', topOffset + 'px', 'important');
    }

    updateSidebarOffset();
    window.addEventListener('resize', updateSidebarOffset, { passive: true });
    if ('ResizeObserver' in window) {
      new ResizeObserver(updateSidebarOffset).observe(sidebar);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupTallSidebar, { once: true });
  } else {
    setupTallSidebar();
  }
})();
</script>
