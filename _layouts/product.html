---
layout: single
---

{% assign product_style = page.product_style | default: "premium" %}

<div class="product-page">

  {% include product-box.html
     product=page.product_id
     style=product_style %}

  {% if page.show_content != false %}
    <div class="product-content">
      {{ content }}
    </div>
  {% endif %}

</div>
